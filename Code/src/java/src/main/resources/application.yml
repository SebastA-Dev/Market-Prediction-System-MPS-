# ==============================================================================
# MPS (Market Prediction System) - Configuración Principal de la Aplicación
# Procesado nativamente por Micronaut y snakeyaml (pom.xml)
# ==============================================================================

micronaut:
  application:
    name: mps-users-service
  session:
    http:
      cookie: true
      header: true
  security:
    authentication: bearer
    token:
      generator:
        access-token:
          expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600}
      jwt:
        claims-generator:
          issuer: mps-users-service
        signatures:
          secret:
            generator:
              secret: ${JWT_GENERATOR_SIGNATURE_SECRET:dev-secret-key-must-be-at-least-32-chars-long!}
              jws-algorithm: HS256
    intercept-url-map:
      - pattern: /api/v1/users/**
        access:
          - isAnonymous()
      - pattern: /api/v1/auth/login
        http-method: POST
        access:
          - isAnonymous()
      - pattern: /swagger/**
        access:
          - isAnonymous()
      - pattern: /swagger-ui/**
        access:
          - isAnonymous()
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
      jsonschema:
        paths: classpath:META-INF/schemas
        mapping: /schemas/**

# ==============================================================================
# Configuración del Pool HikariCP y Conexión PostgreSQL (RNF-17, RNF-25)
# Mapea las variables definidas en .env con valores por defecto seguros
# ==============================================================================
datasources:
  default:
    url: ${JDBC_URL:`jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mps_db}`}
    driver-class-name: org.postgresql.Driver
    username: ${JDBC_USER:`postgres`}
    password: ${JDBC_PASSWORD:`postgres`}
    db-type: postgres
    dialect: POSTGRES
    schema-generate: NONE
    maximum-pool-size: ${DATASOURCES_DEFAULT_MAXIMUM_POOL_SIZE:20}
    connection-timeout: ${DATASOURCES_DEFAULT_CONNECTION_TIMEOUT:250}

# ==============================================================================
# Mapeo JPA y Persistencia (Micronaut Data / Hibernate)
# ==============================================================================
jpa:
  default:
    entity-scan:
      packages: "com.mps.infrastructure.adapters.outbound.persistence.entity"
    properties:
      hibernate:
        hbm2ddl:
          auto: none
        show_sql: false

# ==============================================================================
# Parámetros de Seguridad de Inicio de Sesión (RNF-26, UC-09a)
# ==============================================================================
mps:
  security:
    login:
      max-failed-attempts: 5
      lock-duration: 15m
