micronaut:
  application:
    name: java
  session:
    http:
      cookie: true
      header: true
  security:
    authentication: cookie
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: ${JWT_GENERATOR_SIGNATURE_SECRET:pleaseChangeThisSecretForANewOne}
    intercept-url-map:
      - pattern: /api/v1/users/**
        access:
          - isAnonymous()
      - pattern: /swagger/**
        access:
          - isAnonymous()
      - pattern: /swagger-ui/**
        access:
          - isAnonymous()
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
      jsonschema:
        paths: classpath:META-INF/schemas
        mapping: /schemas/**

datasources:
  default:
    url: ${JDBC_URL:`jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mps_db}`}
    driver-class-name: org.postgresql.Driver
    username: ${JDBC_USER:`postgres`}
    password: ${JDBC_PASSWORD:`postgres`}
    db-type: postgres
    dialect: POSTGRES
    schema-generate: NONE
    maximum-pool-size: 20
    connection-timeout: 250

jpa:
  default:
    entity-scan:
      packages: 'com.mps.infrastructure.adapters.outbound.persistence.entity'
    properties:
      hibernate:
        hbm2ddl:
          auto: update
        show_sql: false
