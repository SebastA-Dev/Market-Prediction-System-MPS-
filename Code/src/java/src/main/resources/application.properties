# ==============================================================================
# MPS (Market Prediction System) - Configuración Estática de la Aplicación
# Toda la configuración dinámica y credenciales se resuelven exclusivamente desde .env
# ==============================================================================

micronaut.application.name=mps-users-service
micronaut.session.http.cookie=true
micronaut.session.http.header=true

# Seguridad y Autenticación JWT (UC-09a)
micronaut.security.authentication=bearer
micronaut.security.token.jwt.claims-generator.issuer=mps-users-service
micronaut.security.token.jwt.signatures.secret.generator.jws-algorithm=HS256

# Rutas públicas y protegidas
micronaut.security.intercept-url-map[0].pattern=/api/v1/users/**
micronaut.security.intercept-url-map[0].access=isAnonymous()
micronaut.security.intercept-url-map[1].pattern=/api/v1/auth/login
micronaut.security.intercept-url-map[1].http-method=POST
micronaut.security.intercept-url-map[1].access=isAnonymous()
micronaut.security.intercept-url-map[2].pattern=/swagger/**
micronaut.security.intercept-url-map[2].access=isAnonymous()
micronaut.security.intercept-url-map[3].pattern=/swagger-ui/**
micronaut.security.intercept-url-map[3].access=isAnonymous()

# Recursos estáticos (Swagger UI y esquemas JSON)
micronaut.router.static-resources.swagger.paths=classpath:META-INF/swagger
micronaut.router.static-resources.swagger.mapping=/swagger/**
micronaut.router.static-resources.swagger-ui.paths=classpath:META-INF/swagger/views/swagger-ui
micronaut.router.static-resources.swagger-ui.mapping=/swagger-ui/**
micronaut.router.static-resources.jsonschema.paths=classpath:META-INF/schemas
micronaut.router.static-resources.jsonschema.mapping=/schemas/**

# Configuración del Driver PostgreSQL y JPA Hibernate
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.db-type=postgres
datasources.default.dialect=POSTGRES
datasources.default.schema-generate=NONE

jpa.default.entity-scan.packages=com.mps.infrastructure.adapters.outbound.persistence.entity
jpa.default.properties.hibernate.hbm2ddl.auto=update
jpa.default.properties.hibernate.show_sql=false

# Políticas de bloqueo de intentos de sesión (RNF-26, UC-09a)
mps.security.login.max-failed-attempts=5
mps.security.login.lock-duration=15m

