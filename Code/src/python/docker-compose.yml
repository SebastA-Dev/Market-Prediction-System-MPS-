services:
  # ==============================================================================
  # MongoDB — Almacenamiento Documental (market_ticks_and_features e INTENT_PREDICTION_LOG)
  # ==============================================================================
  mongodb:
    image: mongo:7.0
    container_name: mps_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: mps_market_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # Redis — Bus de Mensajería Reactiva (Canal 'market_signals')
  # ==============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: mps_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
