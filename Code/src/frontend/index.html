<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexGen Quant | Consejería de Inversión Inteligente</title>
    
    <!-- Dependencies: Tailwind CSS, FontAwesome 6, Chart.js, Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    },
                    colors: {
                        fintech: {
                            bg: '#030712',
                            surface: '#0B132B',
                            card: '#111827',
                            cardBorder: '#1F2937',
                            cardHover: '#374151',
                            emerald: '#10B981',
                            emeraldDark: '#059669',
                            emeraldGlow: 'rgba(16, 185, 129, 0.15)',
                            indigo: '#6366F1',
                            indigoDark: '#4F46E5',
                            amber: '#F59E0B',
                            rose: '#F43F5E',
                            cyan: '#06B6D4',
                            textMuted: '#9CA3AF',
                            textHeading: '#F9FAFB'
                        }
                    },
                    boxShadow: {
                        'glow-emerald': '0 0 25px -5px rgba(16, 185, 129, 0.3)',
                        'glow-indigo': '0 0 25px -5px rgba(99, 102, 241, 0.3)',
                        'fintech-card': '0 10px 30px -10px rgba(0, 0, 0, 0.5)'
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                        'slide-up': 'slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards'
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(12px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #030712; color: #F9FAFB; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .glass-card { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-card-accent { background: linear-gradient(135deg, rgba(17, 24, 39, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%); border: 1px solid rgba(16, 185, 129, 0.25); }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .text-gradient-emerald { background: linear-gradient(135deg, #34D399 0%, #10B981 50%, #059669 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .text-gradient-indigo { background: linear-gradient(135deg, #818CF8 0%, #6366F1 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0B132B; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        .clickable-card { transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
        .clickable-card:hover { transform: translateY(-3px); border-color: rgba(16, 185, 129, 0.4); box-shadow: 0 12px 30px -10px rgba(16, 185, 129, 0.15); }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased bg-fintech-bg text-slate-100">

    <!-- Contenedor Principal montado por la Arquitectura Hexagonal -->
    <div id="app-root" class="min-h-screen flex flex-col antialiased bg-fintech-bg text-slate-100 w-full"></div>

    <!-- Bootstrap del Frontend Hexagonal -->
    <script type="module" src="./src/ui/app.js"></script>
</body>
</html>
