server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Tipos MIME para módulos ES6 (.js)
    include /etc/nginx/mime.types;
    types {
        application/javascript js mjs;
        text/css css;
        text/html html;
        application/json json;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
    }

    # Caché y compresión básica
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Enrutamiento de la aplicación (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para API Python FastAPI (:8000)
    location /api/v1/predict/ {
        proxy_pass http://python-service:8000/api/v1/predict/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Proxy reverso para endpoints de Java Micronaut (:8080)
    location /api/v1/auth/ {
        proxy_pass http://java-service:8080/api/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /api/v1/users {
        proxy_pass http://java-service:8080/api/v1/users;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /api/v1/portfolio/ {
        proxy_pass http://java-service:8080/api/v1/portfolio/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location = /api/v1/portfolio {
        proxy_pass http://java-service:8080/api/v1/portfolio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Healthcheck endpoint para el contenedor frontend
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
